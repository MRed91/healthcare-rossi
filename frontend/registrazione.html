<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Centro Medico Rossi</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <span class="logo">✚ Centro Medico Rossi</span>
        <nav>
            <a href="/">Home</a>
            <a href="/medici.html">Medici</a>
            <a href="/prenota.html">Prenota</a>
        </nav>
    </header>

    <main>
        <section class="card" style="max-width: 560px; margin: 0 auto;">
            <h2>Registrati come paziente</h2>
            <form id="register-form">
                <div class="form-grid">
                    <div class="field">
                        <label for="first_name">Nome</label>
                        <input type="text" id="first_name" required>
                    </div>
                    <div class="field">
                        <label for="last_name">Cognome</label>
                        <input type="text" id="last_name" required>
                    </div>
                    <div class="field">
                        <label for="fiscal_code">Codice fiscale</label>
                        <input type="text" id="fiscal_code" required maxlength="16">
                    </div>
                    <div class="field">
                        <label for="birth_date">Data di nascita</label>
                        <input type="date" id="birth_date" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" required autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="phone">Telefono (facoltativo)</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="field">
                        <label for="password">Password (minimo 8 caratteri)</label>
                        <input type="password" id="password" required minlength="8" autocomplete="new-password">
                    </div>
                </div>
                <div id="register-error" class="alert alert-error" hidden></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Registrati</button>
                </div>
            </form>
            <p class="hint" style="margin-top: 1.25rem;">
                Hai già un account? <a href="/login.html">Accedi</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Project Work — CdS Informatica per le Aziende Digitali (L-31) - Rossi</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
